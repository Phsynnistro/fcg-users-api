# =============================================================================
#  ATENÇÃO — valores de DESENVOLVIMENTO. Secret NÃO é criptografia: "data" é só Base64.
#  Qualquer um com acesso ao repositório (ou a "kubectl get secret -o yaml") lê estes valores.
#  Produção (Aula 07): Azure Key Vault/HashiCorp Vault via External Secrets Operator ou driver CSI,
#  ou Sealed Secrets — e NUNCA commitar o valor real. "stringData" é usado aqui por legibilidade.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: users-api-secrets
  namespace: fcg
  labels:
    app.kubernetes.io/name: users-api
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
type: Opaque
stringData:
  ConnectionStrings__Database: "Host=users-db;Port=5432;Database=fcg_users;Username=fcg_users;Password=users_dev_pwd"
  RabbitMq__Username: "fcg"
  RabbitMq__Password: "fcg_dev_pwd"
  Jwt__PrivateKey: ""
  Seed__AdminPassword: "Admin@12345"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-db-credentials
  namespace: fcg
  labels:
    app.kubernetes.io/name: users-db
    app.kubernetes.io/part-of: fcg
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "1.0.0"
type: Opaque
stringData:
  POSTGRES_DB: "fcg_users"
  POSTGRES_USER: "fcg_users"
  POSTGRES_PASSWORD: "users_dev_pwd"
